[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysign"
version = "0.1.0"
description = "Multi-user digital signage with a lightweight Raspberry Pi player"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = [
    "Django>=5.2,<5.3",
    "Authlib>=1.9.4,<2",
    "joserfc>=1.6,<2",
    "requests>=2.32,<3",
]
player = ["websocket-client>=1.8,<2"]
production = ["gunicorn>=23,<24"]

[project.scripts]
pysign-player = "player.__main__:main"

[tool.setuptools.packages.find]
include = ["pysign*", "signage*", "player*"]

[tool.setuptools.package-data]
signage = ["templates/signage/*.html", "static/signage/*.css"]
