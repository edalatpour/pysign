[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pisign"
version = "0.1.0"
description = "Multi-user digital signage with a lightweight Raspberry Pi player"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = [
    "Django>=5.2,<5.3",
    "msal>=1.39,<2",
    "joserfc>=1.6,<2",
    "requests>=2.32,<3",
    "whitenoise>=6.9,<7",
]
player = ["websocket-client>=1.8,<2", "segno>=1.6,<2"]
production = ["gunicorn>=23,<24", "psycopg[binary]>=3.2,<4"]
azure-sql = [
    "mssql-django>=1.8,<2",
    "pyodbc>=5.2,<6",
    "azure-identity>=1.25,<2",
]

[project.scripts]
pisign-player = "player.__main__:main"

[tool.setuptools.packages.find]
include = ["pisign*", "signage*", "player*"]

[tool.setuptools.package-data]
player = ["watermark.js"]
signage = ["templates/signage/*.html", "static/signage/*.css"]
pisign = ["static/pisign/brand/*.svg", "static/pisign/brand/*.png", "static/pisign/brand/*.ico"]
