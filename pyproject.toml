[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pisign"
version = "0.1.0"
description = "Multi-user digital signage with a lightweight Raspberry Pi player"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = [
    "Django>=5.2,<5.3",
    "msal>=1.39,<2",
    "joserfc>=1.6,<2",
    "requests>=2.32,<3",
    "whitenoise>=6.9,<7",
]
player = ["websocket-client>=1.8,<2"]
production = ["gunicorn>=23,<24", "psycopg[binary]>=3.2,<4"]

[project.scripts]
pisign-player = "player.__main__:main"

[tool.setuptools.packages.find]
include = ["pisign*", "signage*", "player*"]

[tool.setuptools.package-data]
signage = ["templates/signage/*.html", "static/signage/*.css"]
